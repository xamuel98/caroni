# Caroni — task source of truth (GitHub Issues + Projects).
# `pnpm sync` (tools/gh-sync) creates/updates labels, milestones, and issues.
# Issues are matched by `key` (embedded in the issue body as a marker) → idempotent, no dupes.
#
#  milestones     → GitHub milestones (epics M0–M9)
#  labels         → GitHub labels (hex colors)
#  cards[].list   → board Status ("Todo"/"In Progress"/"Done") when a Project is configured
#                   via GH_PROJECT_NUMBER; otherwise applied as a `status:<list>` label.
#
# Move a card between states by editing `list` here + re-syncing, or drag it on the Project board.

repo: ""                              # "owner/name"; blank = infer from `gh repo view`

lists: [Backlog, To Do, In Progress, Done]

milestones:
  M0: "M0 — Spike & Foundations"
  M1: "M1 — Vertical slice"
  M2: "M2 — Transfer happy path"
  M3: "M3 — KYC & tiers"
  M4: "M4 — Exceptions"
  M5: "M5 — Policy depth"
  M6: "M6 — Real-time & audit"
  M7: "M7 — Multi-tenancy"
  M8: "M8 — Polish & deploy"
  M9: "M9 — Portfolio layer"

labels:
  - { name: spike,              color: "8b5cf6" }
  - { name: infra,              color: "3b82f6" }
  - { name: auth,              color: "0ea5e9" }
  - { name: authz,             color: "22c55e" }
  - { name: backend,           color: "f97316" }
  - { name: frontend,          color: "ef4444" }
  - { name: design-system,     color: "eab308" }
  - { name: data,              color: "84cc16" }
  - { name: test,              color: "ec4899" }
  - { name: devops,            color: "111827" }
  - { name: consumer,          color: "16a34a" }
  - { name: ops,               color: "a855f7" }
  - { name: docs,              color: "64748b" }
  - { name: status:todo,        color: "d4d4d8" }
  - { name: status:in-progress, color: "facc15" }
  - { name: status:done,        color: "22c55e" }

cards:
  # ── M0 — Spike & Foundations ─────────────────────────────────────────────
  - key: M0-1
    name: Bootstrap monorepo (pnpm + Turborepo)
    list: To Do
    labels: [infra]
    desc: |
      ## Goal
      Create the monorepo skeleton per TDD §3.
      ## Acceptance
      - `apps/{consumer-portal,ops-console,api}` and `packages/{design-system,shared-types,shared-config}`
      - Turborepo pipeline: lint, typecheck, test, build
      - `pnpm i && pnpm build` succeeds on a clean clone

  - key: M0-2
    name: docker-compose (postgres + opa + thunderid + api + apps)
    list: To Do
    labels: [infra, devops]
    desc: |
      ## Goal
      One command brings the whole stack up locally (TDD §15.1).
      ## Acceptance
      - `docker compose up` starts postgres, opa, thunder, api, both apps
      - Healthchecks pass; services reachable on documented ports

  - key: M0-3
    name: NestJS API skeleton (config + health + modules)
    list: To Do
    labels: [backend]
    desc: |
      ## Goal
      API shell with env config, health endpoint, module structure.
      ## Acceptance
      - `/health` returns ok with dependency status
      - Config validated from env (zod) and fails fast on missing vars

  - key: M0-4
    name: OPA container + hello-world policy + decision endpoint
    list: To Do
    labels: [authz, spike]
    desc: |
      ## Goal
      Wire the BFF to OPA (TDD §6).
      ## Acceptance
      - OPA runs with a seed policy; `POST /v1/data/caroni/decision` responds
      - API calls OPA and maps `allow/reasons/obligations`

  - key: M0-5
    name: ThunderID OIDC app registration (staff) — SPIKE
    list: To Do
    labels: [auth, spike]
    desc: |
      ## Goal
      Confirm the ThunderID integration contract (TDD §5.2).
      ## Acceptance
      - ThunderID runs in Docker; OIDC app `caroni-ops-console` registered
      - PKCE auth-code flow completes locally; id_token validated
      - Document any config deviations from TDD §5.2

  - key: M0-6
    name: Prove end-to-end (login → decision → one gated page)
    list: To Do
    labels: [spike, authz]
    desc: |
      ## Goal
      The M0 exit criterion: the riskiest integration working end to end.
      ## Acceptance
      - Staff logs in via ThunderID, sees a page whose visibility depends on an OPA decision
      - Denied permission hides the page; server also denies on direct call

  - key: M0-7
    name: shared-types (zod) + shared-config packages
    list: To Do
    labels: [backend, frontend]
    desc: |
      ## Goal
      Single source of truth for API contracts (TDD §4).
      ## Acceptance
      - Zod schemas for session, abilities, transfer, case
      - Both apps and API import the same types

  # ── M1 — Vertical slice ─────────────────────────────────────────────────
  - key: M1-1
    name: BFF session model (httpOnly cookie + CSRF)
    list: To Do
    labels: [auth, backend]
    desc: |
      ## Goal
      One session model for both populations (TDD §5.1, §5.4).
      ## Acceptance
      - Session stored server-side; httpOnly/Secure/SameSite cookie issued
      - Mutations require double-submit CSRF token; rotation on login

  - key: M1-2
    name: Staff OIDC login flow (authorize/callback/token exchange)
    list: To Do
    labels: [auth, backend]
    desc: |
      ## Goal
      Staff authenticate via ThunderID (TDD §5.2).
      ## Acceptance
      - `/api/auth/staff/login` → `/callback` sets session (surface=ops)
      - id_token validated (iss/aud/nonce/exp)

  - key: M1-3
    name: Consumer passwordless login (request/verify code)
    list: To Do
    labels: [auth, backend, consumer]
    desc: |
      ## Goal
      First-party consumer auth (TDD §5.3).
      ## Acceptance
      - request-code (rate-limited, TTL 10m) + verify-code → session (surface=consumer)
      - Dev mode logs the code

  - key: M1-4
    name: GET /api/session + /api/session/abilities
    list: To Do
    labels: [authz, backend]
    desc: |
      ## Goal
      Expose session + structured abilities (TDD §6.7, §9.3).
      ## Acceptance
      - Session returns user, surface, activeBranchId, branches
      - Abilities returns catalogue entries + `grants` lookup

  - key: M1-5
    name: OPA decision service + @RequirePermission guard
    list: To Do
    labels: [authz, backend]
    desc: |
      ## Goal
      Server-side enforcement on every route (TDD §6.6).
      ## Acceptance
      - Guard builds OPA input from session/resource
      - 403 responses include reasons/obligations; decision written to `decision_log`

  - key: M1-6
    name: Ops console shell (router + RequireAbility)
    list: To Do
    labels: [frontend, ops]
    desc: |
      ## Goal
      Frontend foundation with permission-aware routing (TDD §12).
      ## Acceptance
      - Sidebar filtered by abilities; unauthorized routes blocked
      - `<Can>` / `useCan` wired to abilities

  - key: M1-7
    name: Deploy first gated page to Railway
    list: To Do
    labels: [devops]
    desc: |
      ## Goal
      Prove deployment early.
      ## Acceptance
      - API + one app + postgres + opa + thunder live on Railway
      - Login works against the deployed environment

  # ── M2 — Transfer happy path ────────────────────────────────────────────
  - key: M2-1
    name: Consumer send-to-tag flow (resolve, validate, confirm)
    list: Backlog
    labels: [frontend, consumer]
    desc: |
      ## Goal
      Instant P2P happy path (TDD §7.3, §16.1).
      ## Acceptance
      - Enter tag → resolve recipient → amount validation → confirmation
      - Receipt + updated balance; clear not-found/self-send states

  - key: M2-2
    name: Tag resolution endpoint
    list: Backlog
    labels: [backend]
    desc: |
      ## Goal
      Resolve a tag without leaking PII (TDD §7.3).
      ## Acceptance
      - `GET /api/consumer/tags/:tag` → { exists, displayName, maskedIdentifier }
      - Reserved/format rules enforced

  - key: M2-3
    name: Ledger schema + double-entry write + invariant test
    list: Backlog
    labels: [backend, data, test]
    desc: |
      ## Goal
      Credible money model (TDD §7.1, §10).
      ## Acceptance
      - ledger_account/ledger_entry/transaction/transfer tables (Prisma)
      - Transfer writes ≥2 balanced entries in one DB tx
      - Invariant test: entries sum to zero per currency

  - key: M2-4
    name: Transfer state machine
    list: Backlog
    labels: [backend]
    desc: |
      ## Goal
      Model states (TDD §7.2).
      ## Acceptance
      - INITIATED→PROCESSING→COMPLETED; branches FAILED/HELD
      - Illegal transitions rejected; transitions audited

  - key: M2-5
    name: Idempotency keys + correlation IDs
    list: Backlog
    labels: [backend]
    desc: |
      ## Goal
      No double-send; traceability (TDD §9.1).
      ## Acceptance
      - Unique (key, user) constraint; replay returns stored response
      - X-Correlation-Id propagated to logs + audit

  - key: M2-6
    name: Consumer transfer history + detail/timeline
    list: Backlog
    labels: [frontend, consumer]
    desc: |
      ## Goal
      Browse and inspect transfers.
      ## Acceptance
      - Paginated list (cursor) + detail with status timeline
      - Virtualized for large datasets

  - key: M2-7
    name: Failure / retry / recovery UX
    list: Backlog
    labels: [frontend, consumer]
    desc: |
      ## Goal
      Design the unhappy paths (PRD §5.5).
      ## Acceptance
      - Explicit loading/validation/failed/retry/recovery states
      - Retry uses same idempotency key → no duplicate

  # ── M3 — KYC + tiers ────────────────────────────────────────────────────
  - key: M3-1
    name: Consumer KYC submission flow (simulated docs)
    list: Backlog
    labels: [frontend, consumer]
    desc: |
      ## Goal
      Self-service verification (TDD §7.4).
      ## Acceptance
      - Submit flow creates a KYC case (PENDING_REVIEW)
      - Resumable, validated, accessible

  - key: M3-2
    name: KYC case creation + routing to ops queue
    list: Backlog
    labels: [backend, ops]
    desc: |
      ## Goal
      Route verification to ops (PRD §6.4).
      ## Acceptance
      - Case created with type=KYC, branch-scoped, priority
      - Appears in the KYC queue

  - key: M3-3
    name: Ops KYC queue + case detail
    list: Backlog
    labels: [frontend, ops]
    desc: |
      ## Goal
      Ops review surface.
      ## Acceptance
      - Queue with filters; case detail with documents + history
      - Permission-gated by `ops_kyc.kyc_case.view`

  - key: M3-4
    name: Ops KYC decide (approve/reject/escalate) + audit
    list: Backlog
    labels: [backend, ops, authz]
    desc: |
      ## Goal
      Decision workflow (TDD §9.3).
      ## Acceptance
      - decide action gated by `ops_kyc.kyc_case.decide`
      - Reason required; action written to audit + decision_log

  - key: M3-5
    name: Tier change → ABAC limit effect
    list: Backlog
    labels: [authz, backend]
    desc: |
      ## Goal
      Verification drives limits (TDD §7.4).
      ## Acceptance
      - Approving KYC raises tier; `data.tier_limits` honored by ABAC
      - Previously-held transfer can complete

  - key: M3-6
    name: Held-by-KYC-limit flow end to end
    list: Backlog
    labels: [authz, consumer, ops]
    desc: |
      ## Goal
      The spine demo (PRD §9, TDD §16.1).
      ## Acceptance
      - Over-limit send → HELD + KYC case → approve → transfer completes
      - Fully scripted as a demo path

  # ── M4 — Exceptions ─────────────────────────────────────────────────────
  - key: M4-1
    name: HELD/FAILED transfer states + case routing
    list: Backlog
    labels: [backend, ops]
    desc: |
      ## Goal
      Exceptions become cases (PRD §6.5).
      ## Acceptance
      - Failed/held transfers create FAILED_TRANSFER cases
      - Routed to the right ops queue by branch

  - key: M4-2
    name: Ops exceptions queue + resolve (retry/reverse)
    list: Backlog
    labels: [frontend, ops, backend]
    desc: |
      ## Goal
      Resolve stuck transfers.
      ## Acceptance
      - Queue + detail; retry and reverse actions gated by permissions
      - Ledger stays consistent after reversal

  - key: M4-3
    name: Dual-control + four-eyes enforcement (PBAC)
    list: Backlog
    labels: [authz, backend]
    desc: |
      ## Goal
      Two-person rule for high-impact actions (TDD §6.8).
      ## Acceptance
      - Above authority → obligation requires_supervisor_approval
      - Approver ≠ original actor; enforced server-side

  - key: M4-4
    name: Escalation to supervisor flow
    list: Backlog
    labels: [frontend, ops, authz]
    desc: |
      ## Goal
      Escalation UX.
      ## Acceptance
      - Agent escalates; supervisor sees it; resolves with four-eyes
      - Analyst self-approval denied

  - key: M4-5
    name: Audit entries for all ops actions
    list: Backlog
    labels: [backend, ops]
    desc: |
      ## Goal
      Append-only accountability (PRD §6.7).
      ## Acceptance
      - Every mutation writes actor/action/resource/decision/reason
      - Visible to Auditor/Admin only

  # ── M5 — Policy depth ───────────────────────────────────────────────────
  - key: M5-1
    name: Rego rbac.rego finalized + opa test
    list: Backlog
    labels: [authz, test]
    desc: |
      ## Goal
      RBAC locked down (TDD §6.8).
      ## Acceptance
      - Role→permission check against `data.role_permissions`
      - `opa test` covers allow/deny per role

  - key: M5-2
    name: Rego abac.rego (limits/authority/branch) + tests
    list: Backlog
    labels: [authz, test]
    desc: |
      ## Goal
      Attribute conditions (TDD §6.8).
      ## Acceptance
      - Tier limits + authority limits + branch scope enforced
      - Unit tests per condition

  - key: M5-3
    name: Rego pbac.rego (four-eyes/segregation/dual-control) + tests
    list: Backlog
    labels: [authz, test]
    desc: |
      ## Goal
      Composed business rules (TDD §6.8).
      ## Acceptance
      - Four-eyes, segregation of duties, dual-control thresholds
      - Unit tests demonstrate each rule

  - key: M5-4
    name: Authorization-matrix test suite (role × attr × action)
    list: Backlog
    labels: [test, authz]
    desc: |
      ## Goal
      The key proof (TDD §14).
      ## Acceptance
      - Table-driven test asserts decision for every role×attribute×action
      - Runs in CI; fails the build on regression

  - key: M5-5
    name: OPA data push on role change
    list: Backlog
    labels: [authz, backend]
    desc: |
      ## Goal
      Keep DB and OPA in sync (TDD §6.4).
      ## Acceptance
      - Role edit → BFF compiles + PUT /v1/data/caroni
      - Reconciliation test: DB roles == OPA data

  - key: M5-6
    name: Super Admin role→permission matrix editor
    list: Backlog
    labels: [frontend, ops, authz]
    desc: |
      ## Goal
      Manage roles in the UI (PRD §6.5).
      ## Acceptance
      - Assign/remove catalogue permissions to a role
      - Changes take effect on subsequent decisions; audited

  # ── M6 — Real-time + audit ──────────────────────────────────────────────
  - key: M6-1
    name: SSE stream — consumer (transfer.updated)
    list: Backlog
    labels: [backend, frontend, consumer]
    desc: |
      ## Goal
      Live transfer status (TDD §11).
      ## Acceptance
      - Consumer subscribes; status changes push in real time
      - Branch + permission scoped

  - key: M6-2
    name: SSE stream — ops (case.*)
    list: Backlog
    labels: [backend, frontend, ops]
    desc: |
      ## Goal
      Live queue updates.
      ## Acceptance
      - case.created/assigned/resolved pushed to eligible staff
      - Queue reflects changes without refresh

  - key: M6-3
    name: SSE reconnect + Last-Event-ID replay + catch-up
    list: Backlog
    labels: [backend, frontend]
    desc: |
      ## Goal
      Resilient streaming (TDD §11).
      ## Acceptance
      - Reconnect replays missed events; client catch-up fetch on gap
      - Polling fallback if SSE unavailable

  - key: M6-4
    name: Audit log UI + filters + export
    list: Backlog
    labels: [frontend, ops]
    desc: |
      ## Goal
      Compliance surface (PRD §6.7).
      ## Acceptance
      - Filter by actor/branch/case/decision/time; paginated
      - Export gated by `ops_audit.audit_entry.export`

  # ── M7 — Multi-tenancy (branches) ───────────────────────────────────────
  - key: M7-1
    name: branch_id scoping middleware + repositories
    list: Backlog
    labels: [backend, data]
    desc: |
      ## Goal
      Logical tenant isolation (TDD §8).
      ## Acceptance
      - Active branch resolved from session; all queries branch-scoped
      - No query can read across branches

  - key: M7-2
    name: Branch config in OPA input + per-branch policy
    list: Backlog
    labels: [authz, backend]
    desc: |
      ## Goal
      Policies differ per region (PRD §6.7).
      ## Acceptance
      - OPA input carries branchId; limits/thresholds resolve per branch
      - NG vs KE demo different outcomes for the same action

  - key: M7-3
    name: Ops branch switcher + scoping
    list: Backlog
    labels: [frontend, ops]
    desc: |
      ## Goal
      Staff scoped to their branches.
      ## Acceptance
      - Switch active branch → queues/config recompute
      - Roles can differ per branch

  - key: M7-4
    name: Cross-branch isolation test suite
    list: Backlog
    labels: [test, authz]
    desc: |
      ## Goal
      Zero cross-branch leakage (NFR).
      ## Acceptance
      - Tests assert no cross-branch reads/writes via API or OPA
      - Runs in CI

  - key: M7-5
    name: Branch admin config editor
    list: Backlog
    labels: [frontend, ops, authz]
    desc: |
      ## Goal
      Tune policy per branch (PRD FR-7.6).
      ## Acceptance
      - Edit thresholds/currency; affects decisions in that branch only
      - Gated by `ops_branches.branch_config.update`

  # ── M8 — Polish + deploy ────────────────────────────────────────────────
  - key: M8-1
    name: Design system package (Radix + Tailwind + CVA) + Storybook
    list: Backlog
    labels: [design-system, frontend]
    desc: |
      ## Goal
      Shared UI foundation (TDD §12.4).
      ## Acceptance
      - `@caroni/design-system` consumed by both apps
      - Storybook documents components; tokens exported

  - key: M8-2
    name: Core components (DataTable, MoneyInput, TagInput, StatusPill, CaseTimeline)
    list: Backlog
    labels: [design-system, frontend]
    desc: |
      ## Goal
      Money-grade primitives.
      ## Acceptance
      - Tabular numerals via Intl; accessible; tested
      - Virtualized DataTable

  - key: M8-3
    name: Dark mode + per-branch theming
    list: Backlog
    labels: [design-system, frontend]
    desc: |
      ## Goal
      First-class theming (PRD §5.5).
      ## Acceptance
      - Dark mode both surfaces; token overrides per branch
      - No hardcoded colors

  - key: M8-4
    name: Command palette (⌘K) in ops console
    list: Backlog
    labels: [frontend, ops]
    desc: |
      ## Goal
      Power-user navigation (PRD §5.5).
      ## Acceptance
      - ⌘K opens palette; results filtered by abilities; keyboard-complete

  - key: M8-5
    name: Accessibility pass (WCAG 2.1 AA) both surfaces
    list: Backlog
    labels: [frontend, test]
    desc: |
      ## Goal
      Accessible money flows (NFR-3).
      ## Acceptance
      - Keyboard-complete; focus management; ARIA; axe clean
      - Screen-reader test on send + approve flows

  - key: M8-6
    name: Performance pass (Core Web Vitals + code splitting)
    list: Backlog
    labels: [frontend]
    desc: |
      ## Goal
      Meet CWV targets (M-5).
      ## Acceptance
      - LCP < 2.5s, CLS < 0.1, INP < 200ms on key pages
      - Route code-splitting; virtualized lists

  - key: M8-7
    name: CI pipeline (lint/typecheck/opa test/unit/matrix/integration/e2e/build)
    list: Backlog
    labels: [devops, test]
    desc: |
      ## Goal
      Automated quality gate (TDD §15.3).
      ## Acceptance
      - GitHub Actions runs all gates; deploy gated on green
      - `opa test` + authorization matrix included

  - key: M8-8
    name: Railway production deploy
    list: Backlog
    labels: [devops]
    desc: |
      ## Goal
      Ship it (TDD §15.4).
      ## Acceptance
      - api + both apps + postgres + opa + thunder on Railway
      - Migrations run on deploy; secrets via env

  # ── M9 — Portfolio layer ────────────────────────────────────────────────
  - key: M9-1
    name: README (architecture diagram + scripted demo paths)
    list: Backlog
    labels: [docs]
    desc: |
      ## Goal
      Convert work into interviews (PRD G5).
      ## Acceptance
      - Architecture diagram + RBAC→ABAC→PBAC narrative
      - Scripted demo paths for each user story

  - key: M9-2
    name: Demo video (3 min)
    list: Backlog
    labels: [docs]
    desc: |
      ## Goal
      Show the product working end to end.
      ## Acceptance
      - Covers send→hold→KYC→approve, dual-control, branch switch
      - Hosted (YouTube/Loom) + linked in README

  - key: M9-3
    name: Written post (RBAC→ABAC→PBAC with OPA + ThunderID)
    list: Backlog
    labels: [docs]
    desc: |
      ## Goal
      Establish expertise publicly.
      ## Acceptance
      - Explains the three models on one flow with code
      - Published (dev.to/blog) + linked

  - key: M9-4
    name: Seed demo data script (branches, users, transfers, cases)
    list: Backlog
    labels: [data, devops]
    desc: |
      ## Goal
      One-command demo-ready state.
      ## Acceptance
      - Seeds NG/KE branches, staff/consumer users, sample transfers + cases
      - Idempotent; safe to re-run
