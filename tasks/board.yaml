# Caroni — task source of truth (GitHub Issues + Projects).
# `pnpm sync` (tools/gh-sync) creates/updates labels, milestones, and issues.
# Issues are matched by `key` (embedded in the issue body as a marker) → idempotent, no dupes.
#
# ── Issue body template ───────────────────────────────────────────────────────
# Each card renders into this structure (set `desc:` to override raw):
#
#   Summary
#   <summary>
#
#   Current State
#   <current_state>
#
#   Requirements
#   <requirements>
#
#   Acceptance Criteria
#   - <acceptance[]>
#
#   Dependencies
#   Depends on:
#   - <dependencies[]>   (or "- None")
#
#  milestones   → GitHub milestones (epics M0–M9)
#  labels       → GitHub labels (hex colors)
#  cards[].list → board Status ("Todo"/"In Progress"/"Done") when a Project is set
#                 (GH_PROJECT_NUMBER); otherwise applied as a `status:<list>` label.

repo: ""                              # "owner/name"; blank = infer from `gh repo view`

lists: [Backlog, To Do, In Progress, Done]

milestones:
  M0: "M0 — Spike & Foundations"
  M1: "M1 — Vertical slice"
  M2: "M2 — Transfer happy path"
  M3: "M3 — KYC & tiers"
  M4: "M4 — Exceptions"
  M5: "M5 — Policy depth"
  M6: "M6 — Real-time & audit"
  M7: "M7 — Multi-tenancy"
  M8: "M8 — Polish & deploy"
  M9: "M9 — Portfolio layer"

labels:
  - { name: spike,              color: "8b5cf6" }
  - { name: infra,              color: "3b82f6" }
  - { name: auth,              color: "0ea5e9" }
  - { name: authz,             color: "22c55e" }
  - { name: backend,           color: "f97316" }
  - { name: frontend,          color: "ef4444" }
  - { name: design-system,     color: "eab308" }
  - { name: data,              color: "84cc16" }
  - { name: test,              color: "ec4899" }
  - { name: devops,            color: "111827" }
  - { name: consumer,          color: "16a34a" }
  - { name: ops,               color: "a855f7" }
  - { name: docs,              color: "64748b" }
  - { name: status:todo,        color: "d4d4d8" }
  - { name: status:in-progress, color: "facc15" }
  - { name: status:done,        color: "22c55e" }

cards:
  # ══ M0 — Spike & Foundations ══════════════════════════════════════════════
  - key: M0-1
    name: Bootstrap monorepo (pnpm + Turborepo)
    list: To Do
    labels: [infra]
    summary: Create the monorepo skeleton (apps + packages + infra) with a shared task runner.
    current_state: Empty repo; no workspaces.
    requirements: pnpm workspaces + Turborepo; shared config packages; root lint/typecheck/test/build.
    acceptance:
      - "apps/{consumer-portal,ops-console,api} and packages/{design-system,shared-types,shared-config} exist"
      - "Turborepo pipeline runs lint, typecheck, test, build"
      - "`pnpm i && pnpm build` succeeds on a clean clone"
    dependencies: []

  - key: M0-2
    name: docker-compose (postgres + opa + thunderid + api + apps)
    list: To Do
    labels: [infra, devops]
    summary: One command brings the whole stack up locally.
    current_state: No containers defined.
    requirements: Compose services with healthchecks, volumes, and documented ports; seeded OPA data.
    acceptance:
      - "`docker compose up` starts postgres, opa, thunder, api, both apps"
      - Healthchecks pass; services reachable on documented ports
    dependencies: [M0-1]

  - key: M0-3
    name: NestJS API skeleton (config + health + modules)
    list: To Do
    labels: [backend]
    summary: API shell with validated env config and a health endpoint.
    current_state: Not started.
    requirements: Env schema (zod) that fails fast; /health reporting dependency status.
    acceptance:
      - "/health returns ok with dependency status"
      - Missing env vars fail startup with a clear message
    dependencies: [M0-1]

  - key: M0-4
    name: OPA container + hello-world policy + decision endpoint
    list: To Do
    labels: [authz, spike]
    summary: Wire the BFF to a running OPA and expose a decision endpoint.
    current_state: Not started.
    requirements: OPA container with a seed policy; API calls it and maps allow/reasons/obligations.
    acceptance:
      - "OPA serves POST /v1/data/caroni/decision"
      - API maps the decision response into {allow, reasons, obligations}
    dependencies: [M0-2, M0-3]

  - key: M0-5
    name: ThunderID OIDC app registration (staff) — SPIKE
    list: To Do
    labels: [auth, spike]
    summary: Confirm the ThunderID integration contract end to end before building on it.
    current_state: ThunderID unverified; image/config assumptions unchecked.
    requirements: Run ThunderID in Docker; register the caroni-ops-console OIDC app; complete PKCE locally.
    acceptance:
      - ThunderID runs in Docker; OIDC app registered
      - PKCE auth-code flow completes locally; id_token validated
      - Deviations from the design captured for follow-up
    dependencies: [M0-2]

  - key: M0-6
    name: Prove end-to-end (login → decision → one gated page)
    list: To Do
    labels: [spike, authz]
    summary: The riskiest integration working end to end — the milestone exit criterion.
    current_state: Not started.
    requirements: A page whose visibility depends on an OPA decision for the logged-in staff user.
    acceptance:
      - Staff logs in via ThunderID and sees a permission-gated page
      - Denied permission hides the page AND the server denies a direct call
    dependencies: [M0-4, M0-5]

  - key: M0-7
    name: shared-types (zod) + shared-config packages
    list: To Do
    labels: [backend, frontend]
    summary: Single source of truth for API contracts and shared tooling config.
    current_state: Not started.
    requirements: Zod schemas for session, abilities, transfer, case; exported TS types; shared eslint/tsconfig/tailwind preset.
    acceptance:
      - Both apps and the API import the same types
      - Contract change fails typecheck across workspaces
    dependencies: [M0-1]

  # ══ M1 — Vertical slice ═══════════════════════════════════════════════════
  - key: M1-1
    name: BFF session model (httpOnly cookie + CSRF)
    list: To Do
    labels: [auth, backend]
    summary: One server-side session model shared by both populations.
    current_state: No session layer.
    requirements: Server-side session store; httpOnly/Secure/SameSite cookie; double-submit CSRF; rotation on login.
    acceptance:
      - Session cookie is httpOnly and never readable by JS
      - Mutations require a valid CSRF token; logout revokes the session
    dependencies: [M0-3]

  - key: M1-2
    name: Staff OIDC login flow (authorize/callback/token exchange)
    list: To Do
    labels: [auth, backend]
    summary: Staff authenticate against ThunderID via OIDC.
    current_state: Not started.
    requirements: login → authorize → callback; validate id_token (iss/aud/nonce/exp); create ops session.
    acceptance:
      - "/api/auth/staff/login → /callback sets an ops session"
      - Invalid id_token is rejected
    dependencies: [M0-5, M1-1]

  - key: M1-3
    name: Consumer passwordless login (request/verify code)
    list: To Do
    labels: [auth, backend, consumer]
    summary: First-party consumer auth via email OTP (dev logger for codes).
    current_state: Not started.
    requirements: request-code (rate-limited, TTL 10m) + verify-code; upsert consumer; create consumer session.
    acceptance:
      - Code request is rate-limited and expires
      - Valid code creates a consumer session; invalid code denied
    dependencies: [M1-1]

  - key: M1-4
    name: GET /api/session + /api/session/abilities
    list: To Do
    labels: [authz, backend]
    summary: Expose session identity and structured permission abilities to the UI.
    current_state: Not started.
    requirements: Session returns user/surface/activeBranchId/branches; abilities returns catalogue entries + grants set.
    acceptance:
      - Session payload matches the shared-types contract
      - Abilities include permission_id + metadata + grants
    dependencies: [M1-1, M0-7]

  - key: M1-5
    name: OPA decision service + @RequirePermission guard
    list: To Do
    labels: [authz, backend]
    summary: Server-side enforcement on every route via a NestJS guard.
    current_state: Not started.
    requirements: Guard builds OPA input from session + resource; 403 returns reasons/obligations; decisions logged.
    acceptance:
      - Guarded route is allowed/denied correctly per policy
      - Every decision writes a decision_log row
    dependencies: [M0-4]

  - key: M1-6
    name: Ops console shell (router + RequireAbility)
    list: To Do
    labels: [frontend, ops]
    summary: Frontend foundation with permission-aware routing and nav.
    current_state: Not started.
    requirements: Sidebar filtered by abilities; RequireAbility route guard; Can/useCan wired to abilities.
    acceptance:
      - Unauthorized routes are blocked; nav hides unpermitted modules
      - Actions render hidden or disabled-with-reason per capability
    dependencies: [M1-4]

  - key: M1-7
    name: Deploy first gated page to Railway
    list: To Do
    labels: [devops]
    summary: Prove deployment early with a login-gated page.
    current_state: Not deployed.
    requirements: Railway project with api + one app + postgres + opa + thunder; env-based config.
    acceptance:
      - Login works against the deployed environment
      - Secrets provided via env (none committed)
    dependencies: [M1-2, M1-6]

  # ══ M2 — Transfer happy path ══════════════════════════════════════════════
  - key: M2-1
    name: Consumer send-to-tag flow (resolve, validate, confirm)
    list: Backlog
    labels: [frontend, consumer]
    summary: The instant P2P happy path — send virtual money to a recipient's tag.
    current_state: No send flow.
    requirements: Tag resolve → amount validation (tier limit) → confirmation → receipt; clear not-found/self-send states.
    acceptance:
      - Successful send shows a receipt and updates the balance
      - Invalid/self tag blocked with a clear message
    dependencies: [M2-2, M2-3, M1-6]

  - key: M2-2
    name: Tag resolution endpoint
    list: Backlog
    labels: [backend]
    summary: Resolve a tag to a recipient without leaking PII.
    current_state: No tag concept implemented.
    requirements: "GET /api/consumer/tags/:tag → { exists, displayName, maskedIdentifier }; format + reserved rules."
    acceptance:
      - Unknown/reserved tags handled explicitly
      - No raw PII returned for a tag lookup
    dependencies: [M0-3]

  - key: M2-3
    name: Ledger schema + double-entry write + invariant test
    list: Backlog
    labels: [backend, data, test]
    summary: Credible money model using a double-entry ledger.
    current_state: No data model.
    requirements: ledger_account/ledger_entry/transaction/transfer tables; balanced entries written in one DB tx.
    acceptance:
      - Transfer writes ≥2 entries that sum to zero per currency
      - Invariant test fails if any transaction is unbalanced
    dependencies: [M0-3]

  - key: M2-4
    name: Transfer state machine
    list: Backlog
    labels: [backend]
    summary: Model transfer lifecycle states and transitions.
    current_state: Not started.
    requirements: "INITIATED→PROCESSING→COMPLETED with branches FAILED/HELD; illegal transitions rejected; transitions audited."
    acceptance:
      - Happy path auto-completes near-instantly
      - Illegal transitions are rejected and logged
    dependencies: [M2-3]

  - key: M2-5
    name: Idempotency keys + correlation IDs
    list: Backlog
    labels: [backend]
    summary: Prevent double-sends and enable traceability.
    current_state: Not started.
    requirements: Unique (key, user) constraint; replay returns the stored response; X-Correlation-Id propagated.
    acceptance:
      - Replayed create returns the original result, no duplicate transfer
      - Correlation ID appears in logs + audit
    dependencies: [M2-3]

  - key: M2-6
    name: Consumer transfer history + detail/timeline
    list: Backlog
    labels: [frontend, consumer]
    summary: Browse and inspect transfers.
    current_state: Not started.
    requirements: Cursor-paginated list; detail view with a status timeline; virtualized rows.
    acceptance:
      - List paginates via cursor
      - Detail shows the full status timeline
    dependencies: [M2-1]

  - key: M2-7
    name: Failure / retry / recovery UX
    list: Backlog
    labels: [frontend, consumer]
    summary: Design the unhappy paths for money movement.
    current_state: Not started.
    requirements: Explicit loading/validation/failed/retry/recovery states; retry reuses the same idempotency key.
    acceptance:
      - Failed transfer offers retry without creating a duplicate
      - Recovery state is clear and accessible
    dependencies: [M2-1, M2-5]

  # ══ M3 — KYC & tiers ══════════════════════════════════════════════════════
  - key: M3-1
    name: Consumer KYC submission flow (simulated docs)
    list: Backlog
    labels: [frontend, consumer]
    summary: Self-service identity verification from the consumer surface.
    current_state: Not started.
    requirements: Validated, resumable submission that creates a KYC case (PENDING_REVIEW).
    acceptance:
      - Submission creates a case and shows a pending status
      - Form is accessible and validates inputs
    dependencies: [M1-6]

  - key: M3-2
    name: KYC case creation + routing to ops queue
    list: Backlog
    labels: [backend, ops]
    summary: Route verification submissions to the ops KYC queue.
    current_state: No case model.
    requirements: Case with type=KYC, branch-scoped, priority; listed in the queue.
    acceptance:
      - Submitting KYC creates a branch-scoped case
      - Case appears in the ops KYC queue
    dependencies: [M3-1, M0-3]

  - key: M3-3
    name: Ops KYC queue + case detail
    list: Backlog
    labels: [frontend, ops]
    summary: Ops review surface for verification cases.
    current_state: Not started.
    requirements: Filterable queue; case detail with documents + history; gated by ops_kyc.kyc_case.view.
    acceptance:
      - Queue filters by status/branch
      - Detail shows documents and prior actions
    dependencies: [M3-2, M1-6]

  - key: M3-4
    name: Ops KYC decide (approve/reject/escalate) + audit
    list: Backlog
    labels: [backend, ops, authz]
    summary: Decision workflow for KYC cases.
    current_state: Not started.
    requirements: decide action gated by ops_kyc.kyc_case.decide; reason required; written to audit + decision_log.
    acceptance:
      - Approve/reject/escalate each enforce permission + reason
      - Every decision is audited
    dependencies: [M3-3, M1-5]

  - key: M3-5
    name: Tier change → ABAC limit effect
    list: Backlog
    labels: [authz, backend]
    summary: Verification tier drives transfer limits.
    current_state: Not started.
    requirements: Approving KYC raises the user's tier; ABAC honors data.tier_limits per branch.
    acceptance:
      - Tier upgrade immediately changes allowed limits
      - A previously-held transfer can then complete
    dependencies: [M3-4, M5-2]

  - key: M3-6
    name: Held-by-KYC-limit flow end to end
    list: Backlog
    labels: [authz, consumer, ops]
    summary: The spine demo — send over limit held, verified, then completed.
    current_state: Not started.
    requirements: Over-limit send → HELD + KYC case → approve → transfer completes.
    acceptance:
      - The full path is scripted and reproducible
      - States and audit are consistent across surfaces
    dependencies: [M3-5, M2-1, M3-3]

  # ══ M4 — Exceptions ═══════════════════════════════════════════════════════
  - key: M4-1
    name: HELD/FAILED transfer states + case routing
    list: Backlog
    labels: [backend, ops]
    summary: Abnormal transfers become cases for ops.
    current_state: Not started.
    requirements: Failed/held transfers create FAILED_TRANSFER cases routed to the right branch queue.
    acceptance:
      - A failed transfer creates a case
      - Case routes to the correct ops queue by branch
    dependencies: [M2-4]

  - key: M4-2
    name: Ops exceptions queue + resolve (retry/reverse)
    list: Backlog
    labels: [frontend, ops, backend]
    summary: Ops resolves stuck or failed transfers.
    current_state: Not started.
    requirements: Queue + detail; retry and reverse actions gated by permissions; ledger stays consistent.
    acceptance:
      - Retry completes a held/failed transfer
      - Reverse produces balanced ledger entries
    dependencies: [M4-1, M1-6]

  - key: M4-3
    name: Dual-control + four-eyes enforcement (PBAC)
    list: Backlog
    labels: [authz, backend]
    summary: Two-person rule for high-impact actions.
    current_state: Not started.
    requirements: Above authority → obligation requires_supervisor_approval; approver ≠ original actor; enforced server-side.
    acceptance:
      - Over-threshold action is blocked without a second approver
      - Self-approval is denied
    dependencies: [M5-3]

  - key: M4-4
    name: Escalation to supervisor flow
    list: Backlog
    labels: [frontend, ops, authz]
    summary: Escalation UX for actions beyond an agent's authority.
    current_state: Not started.
    requirements: Agent escalates; supervisor sees and resolves with four-eyes; analyst self-approval denied.
    acceptance:
      - Escalated case appears for supervisors
      - Resolution enforces four-eyes
    dependencies: [M4-3, M4-2]

  - key: M4-5
    name: Audit entries for all ops actions
    list: Backlog
    labels: [backend, ops]
    summary: Append-only accountability for every ops mutation.
    current_state: Not started.
    requirements: Write actor/action/resource/decision/reason; visible to Auditor/Admin only.
    acceptance:
      - Every ops mutation writes an audit row
      - Audit is read-only and permission-gated
    dependencies: [M1-5]

  # ══ M5 — Policy depth ═════════════════════════════════════════════════════
  - key: M5-1
    name: Rego rbac.rego finalized + opa test
    list: Backlog
    labels: [authz, test]
    summary: Lock down role→permission checks.
    current_state: Seed policy only.
    requirements: rbac.rego checks data.role_permissions; unit tests per role.
    acceptance:
      - Allow/deny correct for each role
      - opa test green
    dependencies: [M0-4]

  - key: M5-2
    name: Rego abac.rego (limits/authority/branch) + tests
    list: Backlog
    labels: [authz, test]
    summary: Attribute conditions on top of roles.
    current_state: Seed policy only.
    requirements: Enforce tier limits, authority limits, and branch scope.
    acceptance:
      - Each condition covered by a unit test
      - Out-of-scope/over-limit denied
    dependencies: [M5-1]

  - key: M5-3
    name: Rego pbac.rego (four-eyes/segregation/dual-control) + tests
    list: Backlog
    labels: [authz, test]
    summary: Composed business rules.
    current_state: Seed policy only.
    requirements: Four-eyes, segregation of duties, dual-control thresholds.
    acceptance:
      - Each rule demonstrated by a unit test
    dependencies: [M5-2]

  - key: M5-4
    name: Authorization-matrix test suite (role × attr × action)
    list: Backlog
    labels: [test, authz]
    summary: The key proof that the whole authorization model works.
    current_state: Not started.
    requirements: Table-driven suite asserting the decision for every role × attribute × action permutation.
    acceptance:
      - Suite covers the catalogue; runs in CI
      - Build fails on any regression
    dependencies: [M5-1, M5-2, M5-3]

  - key: M5-5
    name: OPA data push on role change
    list: Backlog
    labels: [authz, backend]
    summary: Keep the DB role matrix and OPA in sync.
    current_state: Not started.
    requirements: Role edit → compile role_permissions → PUT /v1/data/caroni; push on boot too.
    acceptance:
      - Editing a role changes subsequent decisions
      - Reconciliation test: DB roles == OPA data
    dependencies: [M5-1, M1-5]

  - key: M5-6
    name: Super Admin role→permission matrix editor
    list: Backlog
    labels: [frontend, ops, authz]
    summary: Manage roles and their permissions from the UI.
    current_state: Not started.
    requirements: Assign/remove catalogue permissions to a role; changes audited and take effect immediately.
    acceptance:
      - Permission changes reflect in abilities + decisions
      - Action gated by ops_roles.role.update
    dependencies: [M5-5, M1-6]

  # ══ M6 — Real-time & audit ════════════════════════════════════════════════
  - key: M6-1
    name: SSE stream — consumer (transfer.updated)
    list: Backlog
    labels: [backend, frontend, consumer]
    summary: Live transfer status for the consumer surface.
    current_state: Not started.
    requirements: SSE endpoint; branch- and permission-scoped events.
    acceptance:
      - Status changes push without refresh
      - Only eligible clients receive events
    dependencies: [M2-4]

  - key: M6-2
    name: SSE stream — ops (case.*)
    list: Backlog
    labels: [backend, frontend, ops]
    summary: Live queue updates for ops staff.
    current_state: Not started.
    requirements: Push case.created/assigned/resolved to eligible staff.
    acceptance:
      - Queues update live
      - Events are permission-scoped
    dependencies: [M3-3]

  - key: M6-3
    name: SSE reconnect + Last-Event-ID replay + catch-up
    list: Backlog
    labels: [backend, frontend]
    summary: Resilient streaming across reconnects.
    current_state: Not started.
    requirements: Replay missed events via Last-Event-ID; client catch-up fetch; polling fallback.
    acceptance:
      - Reconnect recovers missed events without duplicates
      - Fallback works when SSE is unavailable
    dependencies: [M6-1, M6-2]

  - key: M6-4
    name: Audit log UI + filters + export
    list: Backlog
    labels: [frontend, ops]
    summary: Compliance surface over the audit trail.
    current_state: Not started.
    requirements: Filter by actor/branch/case/decision/time; paginated; export gated by permission.
    acceptance:
      - Filters and pagination work
      - Export gated by ops_audit.audit_entry.export
    dependencies: [M4-5, M1-6]

  # ══ M7 — Multi-tenancy ════════════════════════════════════════════════════
  - key: M7-1
    name: branch_id scoping middleware + repositories
    list: Backlog
    labels: [backend, data]
    summary: Logical tenant isolation by branch.
    current_state: Not started.
    requirements: Resolve activeBranchId from session; scope every query; inject into repositories.
    acceptance:
      - No query can read across branches
      - Every tenant table carries branch_id
    dependencies: [M0-3]

  - key: M7-2
    name: Branch config in OPA input + per-branch policy
    list: Backlog
    labels: [authz, backend]
    summary: Policies differ per regional branch.
    current_state: Not started.
    requirements: OPA input carries branchId; limits/thresholds resolve per branch.
    acceptance:
      - Same action yields different outcomes for NG vs KE
      - Branch config drives the decision
    dependencies: [M5-2, M7-1]

  - key: M7-3
    name: Ops branch switcher + scoping
    list: Backlog
    labels: [frontend, ops]
    summary: Staff operate within their branch(es).
    current_state: Not started.
    requirements: Switch active branch → queues/config recompute; roles can differ per branch.
    acceptance:
      - Switching branch recomputes abilities and data
      - Cross-branch access denied
    dependencies: [M7-1, M1-6]

  - key: M7-4
    name: Cross-branch isolation test suite
    list: Backlog
    labels: [test, authz]
    summary: Prove zero cross-branch leakage.
    current_state: Not started.
    requirements: Tests asserting no cross-branch reads/writes via API or OPA; run in CI.
    acceptance:
      - Attempted cross-branch access fails in every path
    dependencies: [M7-1, M7-2]

  - key: M7-5
    name: Branch admin config editor
    list: Backlog
    labels: [frontend, ops, authz]
    summary: Tune policy per branch without affecting others.
    current_state: Not started.
    requirements: Edit thresholds/currency; affects only that branch; gated by ops_branches.branch_config.update.
    acceptance:
      - Config change affects only its branch
      - Action permission-gated and audited
    dependencies: [M7-2, M5-6]

  # ══ M8 — Polish & deploy ══════════════════════════════════════════════════
  - key: M8-1
    name: Design system package (Radix + Tailwind + CVA) + Storybook
    list: Backlog
    labels: [design-system, frontend]
    summary: Shared, documented UI foundation for both surfaces.
    current_state: Not started.
    requirements: "@caroni/design-system consumed by both apps; tokens exported; Storybook docs."
    acceptance:
      - Both apps import the package
      - Storybook builds with usage docs
    dependencies: [M0-1]

  - key: M8-2
    name: Core components (DataTable, MoneyInput, TagInput, StatusPill, CaseTimeline)
    list: Backlog
    labels: [design-system, frontend]
    summary: Money-grade, accessible primitives.
    current_state: Not started.
    requirements: Tabular numerals via Intl; accessible; virtualized DataTable; component tests.
    acceptance:
      - Components are tested and documented
      - Money values render with tabular numerals
    dependencies: [M8-1]

  - key: M8-3
    name: Dark mode + per-branch theming
    list: Backlog
    labels: [design-system, frontend]
    summary: First-class theming on both surfaces.
    current_state: Not started.
    requirements: Dark mode + token overrides per branch; no hardcoded colors.
    acceptance:
      - Dark mode works across both apps
      - Branch theme overrides tokens only
